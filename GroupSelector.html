<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* group selectors*/
        .red{
            background-color: blue;
            font-size:40px;
        }
        .blue
        {
            border:10px solid black;
        }
        #black{
            background-color: rgb(0, 255, 102);
            font-size:20px;
        }
        #white
        {
            border:10px dotted rgb(183, 18, 18);
        }
    </style>
</head>
<body>
    <h1 class="red blue">This is my heading</h1>
    <p id="black">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quia distinctio accusantium officia tempore eligendi et sed odio, tenetur praesentium vero quis aperiam saepe error sunt odit libero earum veritatis amet.</p>
</body>
</html>
